name: Package Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - edited

jobs:
  validate-metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build drovr
        run: pnpm run build

      - name: Validate pull request title
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          node ./dist/cli.mjs package-release validate "${{ github.event.pull_request.title }}"

      - name: Validate pull request commits
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          COMMITS_FILE=$(mktemp)
          git log --format=%B%x00 "origin/${{ github.base_ref }}..HEAD" > "$COMMITS_FILE"
          while IFS= read -r -d $'\0' commit; do
            [ -z "$commit" ] && continue
            node ./dist/cli.mjs package-release validate "$commit"
          done < "$COMMITS_FILE"
          rm -f "$COMMITS_FILE"

      - name: Validate pushed commits
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ] || [ -z "${{ github.event.before }}" ]; then
            RANGE="HEAD~1..HEAD"
          else
            RANGE="${{ github.event.before }}..${{ github.event.after }}"
          fi
          COMMITS_FILE=$(mktemp)
          git log --format=%B%x00 "$RANGE" > "$COMMITS_FILE"
          while IFS= read -r -d $'\0' commit; do
            [ -z "$commit" ] && continue
            node ./dist/cli.mjs package-release validate "$commit"
          done < "$COMMITS_FILE"
          rm -f "$COMMITS_FILE"

  release-please:
    runs-on: ubuntu-latest
    needs: validate-metadata
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build drovr
        run: pnpm run build

      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Reconcile Release PR with canonical notes
        if: steps.release.outputs.pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_JSON: ${{ steps.release.outputs.pr }}
        run: |
          set -euo pipefail
          PR_NUMBER=$(node -e 'console.log(JSON.parse(process.env.PR_JSON).number)')
          PR_TITLE=$(node -e 'console.log(JSON.parse(process.env.PR_JSON).title || "")')
          PR_BODY=$(node -e 'console.log(JSON.parse(process.env.PR_JSON).body || "")')

          RESULT=$(node ./dist/cli.mjs package-release reconcile-pr --title "$PR_TITLE" --body "$PR_BODY" --json)
          ACTION=$(node -e 'console.log(JSON.parse(process.argv[1]).action)' "$RESULT")

          if [ "$ACTION" = "close" ]; then
            echo "No user-facing releasable changes in proposed range. Closing Release PR #$PR_NUMBER."
            gh pr close "$PR_NUMBER" --comment "Closed by Package Release automation: no user-facing changes (Breaking Changes, Added, Changed, Fixed, Removed) in proposed range."
          else
            UPDATED_BODY=$(node -e 'console.log(JSON.parse(process.argv[1]).body)' "$RESULT")
            gh pr edit "$PR_NUMBER" --body "$UPDATED_BODY"
          fi

      - name: Prepare draft GitHub Release
        if: steps.release.outputs.releases_created == 'true' || steps.release.outputs.tag_name
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          node ./dist/cli.mjs package-release prepare \
            --tag "$RELEASE_TAG" \
            --version "$RELEASE_VERSION" \
            --sha "$TARGET_SHA"
